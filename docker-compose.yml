services:

  # Backend API
  backend:
    container_name: taxilibre-backend
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 3003
    depends_on:
      - postgres
      - redis
    networks:
      - taxilibre-network
    volumes:
      - ./backend:/app
      - /app/node_modules


  # PostgreSQL Database with PostGIS
  postgres:
    container_name: taxilibre-postgres
    image: postgis/postgis:15-3.3
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-taxilibre}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-password}
      POSTGRES_DB: ${DB_NAME:-taxilibre}
    volumes:
        - postgres_data:/var/lib/postgresql/data
        - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    networks:
        - taxilibre-network
    healthcheck:
        test: ["CMD-SHELL", "pg_isready -U taxilibre"]
        interval: 10s
        timeout: 5s
        retries: 5


  # Redis Cache / Real-time
  redis:
    container_name: taxilibre-redis
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server /usr/local/etc/redis/redis.conf
    volumes:
        - redis_data:/data
        - ./docker/redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
    ports:
      - "6379:6379"
    networks:
        - taxilibre-network
    healthcheck:
        test: ["CMD", "redis-cli", "ping"]
        interval: 10s
        timeout: 5s
        retries: 5


  # Passenger Web
  passenger-web:
    container_name: taxilibre-passenger-web
    build:
        context: ./apps/passenger-web
        dockerfile: Dockerfile
    restart: unless-stopped
    environment:
        VITE_API_URL: http://localhost/api
    depends_on:
        - backend
    networks:
        - taxilibre-network


  # Driver Web
  driver-web:
    container_name: taxilibre-driver-web
    build:
        context: ./apps/driver-web
        dockerfile: Dockerfile
    restart: unless-stopped
    environment:
        VITE_API_URL: http://localhost/api
    depends_on:
        - backend
    networks:
        - taxilibre-network


  # Admin Dashboard
  admin-dashboard:
    container_name: taxilibre-admin-dashboard
    build:
        context: ./apps/admin-dashboard
        dockerfile: Dockerfile
    restart: unless-stopped
    environment:
        VITE_API_URL: http://localhost/api
    depends_on:
        - backend
    networks:
        - taxilibre-network


  # Nginx Gateway
  gateway:
    container_name: taxilibre-gateway
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - backend
      - passenger-web
      - driver-web
      - admin-dashboard
    ports:
        - "80:80"
    volumes:
      - ./gateway-nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - taxilibre-network


networks:
  taxilibre-network:
    driver: bridge


volumes:
  postgres_data:
  redis_data:

services:
  - type: web
    name: backend
    env: docker
    plan: free
    region: oregon
    dockerfilePath: ./backend/Dockerfile
    # The start command is already defined in Dockerfile via CMD
    # No need to specify startCommand unless overriding
    # But we can set it explicitly:
    startCommand: "./start.sh"
